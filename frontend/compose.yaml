# Development workspace: the app runs in this container, so Node and npm are not needed on the host.
services:
  app:
    build:
      context: .
      target: dev
    image: barpraza-frontend-dev:local
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      # Your source, live: edits on the host show up in the container.
      - .:/app
      # Keep the container's own node_modules, so the host's copy (if any) is never used.
      - node_modules:/app/node_modules
    environment:
      # Docker on Windows does not send file-change events reliably; poll instead.
      CHOKIDAR_USEPOLLING: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  node_modules:
