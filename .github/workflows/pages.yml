name: Deploy to GitHub Pages

# Builds the frontend and publishes it to GitHub Pages. Runs on demand only.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the frontend for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The public Pages site keeps the demo login on purpose (D-14). Only this workflow sets the flag;
      # the default build and CI never include the demo accounts.
      - name: Typecheck and build for the Pages path
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
        run: |
          node node_modules/typescript/bin/tsc -b
          node node_modules/vite/bin/vite.js build --base=/bar-praza-frontend/

      # GitHub Pages serves 404.html for unknown paths; the app handles them itself (BrowserRouter).
      - name: Add the single-page fallback
        working-directory: frontend/dist
        run: cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
