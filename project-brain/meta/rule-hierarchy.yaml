scopes:
  hard:     { rank: 0, overridable: false }
  global:   { rank: 1, overridable: true }
  client:   { rank: 2, overridable: true }
  project:  { rank: 3, overridable: true }
  role:     { rank: 4, overridable: true }
  task:     { rank: 5, overridable: true }

resolution_order:
  1: scope_rank          # lower rank wins; hard always wins, no exceptions
  2: specificity         # narrower scope beats broader within same rank
  3: explicit_over_implicit
  4: supersedes_chain    # newer superseding rule wins
  5: escalate_to_human   # if still ambiguous, DO NOT GUESS
